name: Prepare runner
description: Pinned Go and Node, native headers and pinned tools. Full prep for jobs that build the app; race shards get Go and the cgo headers only.
inputs:
  full:
    description: "true installs GTK/WebKit headers, npm, Wails, staticcheck and the frontend dependencies"
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: '1.27.3'
        cache: true
    - if: inputs.full == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24.16.0'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    # 11/11/2026: plain-http Ubuntu mirrors stopped answering from the runner (20 s per
    # index, job killed at 30 min) while https worked. Short timeouts, then once on a list
    # of https mirrors. The runner resolves the archive through /etc/apt/apt-mirrors.txt;
    # apt moves to the next line when a mirror fails.
    - name: Native headers (bounded, with mirror fallback)
      shell: bash
      env:
        PACKAGES: ${{ inputs.full == 'true' && 'libgtk-3-dev libwebkit2gtk-4.1-dev libwebp-dev dpkg-dev python3-pil' || 'libwebp-dev' }}
      run: |
        apt_opts=(-o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10)
        install() {
          timeout 120 sudo apt-get "${apt_opts[@]}" update &&
          timeout 300 sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends $PACKAGES
        }
        if ! install; then
          echo "::warning::runner apt mirror failed; retrying on https mirrors"
          printf '%s\n' https://mirrors.edge.kernel.org/ubuntu/ https://mirrors.ocf.berkeley.edu/ubuntu/ \
            https://mirror.math.princeton.edu/pub/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          # security.ubuntu.com is listed directly in the sources; route it through the same list
          sudo sed -i -E 's#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu/?#mirror+file:/etc/apt/apt-mirrors.txt#g' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          install
        fi
    - if: inputs.full == 'true'
      name: Pinned tools
      shell: bash
      env:
        GOTOOLCHAIN: local
      run: |
        mkdir -p .tools/bin
        npm install --prefix .tools/npm npm@11.17.0
        echo "$PWD/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
        GOBIN="$PWD/.tools/bin" go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
        GOBIN="$PWD/.tools/bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
        go mod download
        test -x /usr/bin/google-chrome # explicit existing runner browser, no hidden downloads
        npm --prefix frontend ci
    - if: inputs.full != 'true'
      name: Go modules
      shell: bash
      env:
        GOTOOLCHAIN: local
      run: go mod download
