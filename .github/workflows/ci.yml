name: Product foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, official tag verified
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Explicit runner preparation
        env:
          GOTOOLCHAIN: local
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libwebp-dev dpkg-dev
          mkdir -p .tools/bin
          npm install --prefix .tools/npm npm@11.17.0
          echo "$PWD/.tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
          GOBIN="$PWD/.tools/bin" go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          GOBIN="$PWD/.tools/bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go mod download
      - run: test -x /usr/bin/google-chrome # explicit existing runner browser, no hidden downloads
      - run: npm --prefix frontend ci
      - run: make tools-check check test-integration package test-visual
      # Native desktop journey and operational boot/logout remain separate acceptance gates.
