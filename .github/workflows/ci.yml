name: Product foundation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  # a newer push to the same ref supersedes the run in progress
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
# `make ci` = front + go + race + package. The jobs below run those same parts in
# parallel; the slow race packages are split by scripts/ci/race-shard.sh.
jobs:
  front:
    name: front (quality, lint, vitest, staticcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, official tag verified
      - uses: ./.github/actions/prepare
      - run: make check-front quality
  go:
    name: go (vet, test, race outside the slow packages)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, official tag verified
      - uses: ./.github/actions/prepare
      - run: make check-go
      - name: race outside the sharded packages
        run: make check-race RACE_PKGS="$(go list ./... | grep -vxE 'infradesktop/internal/adapters/(ipc|routerssh)' | tr '\n' ' ')"
  race:
    name: race ${{ matrix.shard.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: ipc-account, pkg: ./internal/adapters/ipc, args: 'only TestIntegrationAccountClient' }
          - { name: ipc-live, pkg: ./internal/adapters/ipc, args: 'only TestPPPoELiveFiniteWindow' }
          - { name: ipc-rest-1, pkg: ./internal/adapters/ipc, args: 'rest 1 2 "TestIntegrationAccountClient TestPPPoELiveFiniteWindow"' }
          - { name: ipc-rest-2, pkg: ./internal/adapters/ipc, args: 'rest 2 2 "TestIntegrationAccountClient TestPPPoELiveFiniteWindow"' }
          - { name: routerssh-tick, pkg: ./internal/adapters/routerssh, args: 'only TestRadioTickRecoveryPeer' }
          - { name: routerssh-rest, pkg: ./internal/adapters/routerssh, args: 'rest 1 1 TestRadioTickRecoveryPeer' }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, official tag verified
      - uses: ./.github/actions/prepare
        with:
          full: 'false'
      - run: make check-race-shard RACE_PKGS=${{ matrix.shard.pkg }} RACE_RUN="$(scripts/ci/race-shard.sh ${{ matrix.shard.pkg }} ${{ matrix.shard.args }})"
  package:
    name: package (integration, package, vault, part1 production)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, official tag verified
      - uses: ./.github/actions/prepare
      - run: make ci-package
  # Native desktop journey and operational boot/logout remain separate acceptance gates.
